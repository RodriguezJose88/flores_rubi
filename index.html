<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --btn-color: #ffd700;
            --btn-hover: #ffea00;
            --text-color: #333;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Radial gradient for the dark opaque background */
            background: radial-gradient(circle at center, #2a2a2a 0%, #111 100%);
        }

        .center-container {
            z-index: 10;
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            background-color: var(--btn-color);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Ripple effect for button */
        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        button:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }

        #petals-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto; /* Allow interaction with petals */
        }

        #sunflowers-canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through to petals */
        }

        #background-photo {
            position: absolute;
            top: 42%; /* Centered slightly higher to leave room for the player */
            left: 50%;
            transform: translate(-50%, -50%);
            max-height: 65vh; /* Adjusted to fit nicely above the player */
            max-width: 90vw;
            border-radius: 20px;
            object-fit: cover;
            z-index: 2; /* Below the sunflowers and petals */
            opacity: 0;
            pointer-events: none; /* Allows user to click petals hovering over the photo */
            transition: opacity 3s ease-in-out; /* Smooth, elegant fade-in */
            /* Professional cinematic edge fading */
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 90%);
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 90%);
        }

        #background-photo.show {
            opacity: 0.45; /* Makes it "tenue" and transparent */
        }

        .hidden {
            display: none !important;
        }

        .custom-audio-player {
            position: absolute;
            bottom: -350px; /* Start hidden below the screen */
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            background-color: #FFD700; /* Yellow like the sunflower */
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            z-index: 20;
            transition: bottom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #1a1a1a;
        }

        .custom-audio-player.show {
            bottom: 50px; /* Slides up to sit neatly below the photo */
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .titles h2 {
            font-family: 'Georgia', serif;
            font-size: 22px;
            margin: 0 0 6px 0;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .titles h3 {
            font-family: 'Georgia', serif;
            font-size: 16px;
            margin: 0;
            font-weight: normal;
            color: #333;
        }

        .icon-heart {
            width: 28px;
            height: 28px;
            fill: #1a1a1a;
            cursor: pointer;
        }

        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #1a1a1a;
            cursor: pointer;
            margin-top: -7px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #1a1a1a;
            border-radius: 2px;
        }

        input[type=range]::-moz-range-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #1a1a1a;
            cursor: pointer;
            border: none;
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #1a1a1a;
            border-radius: 2px;
        }
        
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-top: 10px;
            font-weight: 600;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            transition: transform 0.2s;
        }

        .ctrl-btn:hover {
            transform: scale(1.1);
        }

        .ctrl-btn svg {
            width: 24px;
            height: 24px;
            fill: #1a1a1a;
        }

        .play-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .play-btn svg {
            width: 32px;
            height: 32px;
            fill: #FFD700 !important;
            margin-left: 4px; /* Offset to center play triangle */
        }
        
        .play-btn.playing svg {
            margin-left: 0;
        }
    </style>
</head>
<body>

    <!-- Canvas for falling interactive petals -->
    <canvas id="petals-canvas"></canvas>
    
    <!-- Canvas for sprouting sunflowers from the bottom -->
    <canvas id="sunflowers-canvas"></canvas>

    <!-- Professional Background Photo -->
    <img id="background-photo" src="FOTO.jpg" alt="FOTO">

    <!-- Central Button Container -->
    <div class="center-container" id="btn-container">
        <button id="action-btn">Recibe tus flores amarillas</button>
    </div>

    <div id="custom-audio-player" class="custom-audio-player">
        <div class="player-header">
            <div class="titles">
                <h2>Flores Amarillas</h2>
                <h3>Artist Rubi &lt;3</h3>
            </div>
            <svg class="icon-heart" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <div class="progress-container">
            <input type="range" id="progress-bar" value="0" min="0" max="100">
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration-time">0:00</span>
            </div>
        </div>

        <div class="controls-row">
            <!-- Shuffle -->
            <button class="ctrl-btn">
                <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            <!-- Prev -->
            <button class="ctrl-btn">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <!-- Play/Pause -->
            <button class="play-btn" id="play-pause-btn">
                <svg viewBox="0 0 24 24" fill="#FFD700"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <!-- Next -->
            <button class="ctrl-btn">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <!-- Repeat -->
            <button class="ctrl-btn">
                <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
        </div>
    </div>

    <!-- Hidden Local Audio/MP4 Element -->
    <audio id="local-audio" src="song_flores.mp4" loop preload="metadata"></audio>

    <script>
        const petalsCanvas = document.getElementById('petals-canvas');
        const petalsCtx = petalsCanvas.getContext('2d');
        const sunflowersCanvas = document.getElementById('sunflowers-canvas');
        const sunflowersCtx = sunflowersCanvas.getContext('2d');
        const actionBtn = document.getElementById('action-btn');
        const btnContainer = document.getElementById('btn-container');
        const bgPhoto = document.getElementById('background-photo');

        const customPlayer = document.getElementById('custom-audio-player');
        const audioEl = document.getElementById('local-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');

        // Play and Pause Toggle Logic
        playPauseBtn.addEventListener('click', () => {
            if (audioEl.paused) {
                audioEl.play();
                playPauseBtn.classList.add('playing');
                // Switch to Pause SVG
                playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="#FFD700"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
            } else {
                audioEl.pause();
                playPauseBtn.classList.remove('playing');
                // Switch to Play SVG
                playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="#FFD700"><path d="M8 5v14l11-7z"/></svg>';
            }
        });

        // Formats time in seconds to M:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Update Progress Bar as audio plays
        audioEl.addEventListener('timeupdate', () => {
            if (audioEl.duration) {
                const progressPercent = (audioEl.currentTime / audioEl.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(audioEl.currentTime);
            }
        });

        // Set duration text once metadata is loaded
        audioEl.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audioEl.duration);
        });

        // Allow seeking via the range slider
        progressBar.addEventListener('input', (e) => {
            if (audioEl.duration) {
                const seekTime = (e.target.value / 100) * audioEl.duration;
                audioEl.currentTime = seekTime;
            }
        });

        let width, height;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            petalsCanvas.width = width;
            petalsCanvas.height = height;
            sunflowersCanvas.width = width;
            sunflowersCanvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // Mouse interaction state
        const mouse = {
            x: null,
            y: null,
            radius: 50,
            isDown: false
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mousedown', () => {
            mouse.isDown = true;
        });

        window.addEventListener('mouseup', () => {
            mouse.isDown = false;
        });

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        class Petal {
            constructor() {
                this.reset();
                // Randomize initial Y so they are already on screen when loaded
                this.y = Math.random() * height; 
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20 - Math.random() * 50; // Start above screen
                this.size = Math.random() * 15 + 10;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 1;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.05;
                // Yellow shades
                const colors = ['#FFD700', '#FFC125', '#FFB90F', '#EEC900'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.captured = false;
                this.targetX = null;
                this.targetY = null;
                
                // 3D effect variables (shape deformation)
                this.scaleX = 1;
                this.scaleY = 1;
                this.phase = Math.random() * Math.PI * 2;
            }

            update() {
                if (this.captured) {
                    // Fly towards mouse center and disappear
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    this.x += dx * 0.1;
                    this.y += dy * 0.1;
                    this.size *= 0.9; // Shrink
                    if (this.size < 1) {
                        this.reset();
                    }
                    return;
                }

                // Normal falling
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;
                this.phase += 0.02;
                
                // Simulate 3D rotation by scaling axes
                this.scaleX = Math.cos(this.phase) * 0.5 + 0.5;
                this.scaleY = Math.sin(this.phase) * 0.3 + 0.7;

                // Interaction with mouse (push away)
                if (mouse.x && mouse.y) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius * 2) { // Detection radius
                        if (mouse.isDown && distance < mouse.radius) {
                            // Capture petal on click
                            this.captured = true;
                        } else {
                            // Push away
                            const force = (mouse.radius * 2 - distance) / (mouse.radius * 2);
                            const directionX = dx / distance;
                            const directionY = dy / distance;
                            this.x += directionX * force * 5;
                            // Dampen vertical fall temporarily when pushed
                            this.y += directionY * force * 5 - this.speedY; 
                        }
                    }
                }

                // Reset if off screen
                if (this.y > height + 20 || this.x < -50 || this.x > width + 50) {
                    this.reset();
                }
            }

            draw() {
                petalsCtx.save();
                petalsCtx.translate(this.x, this.y);
                petalsCtx.rotate(this.angle);
                petalsCtx.scale(this.scaleX, this.scaleY);
                
                petalsCtx.beginPath();
                // Draw a petal shape using bezier curves
                petalsCtx.moveTo(0, 0);
                petalsCtx.bezierCurveTo(-this.size/2, -this.size/3, -this.size/2, this.size, 0, this.size);
                petalsCtx.bezierCurveTo(this.size/2, this.size, this.size/2, -this.size/3, 0, 0);
                
                // Create a subtle gradient for depth
                const grad = petalsCtx.createRadialGradient(0, this.size/2, 0, 0, this.size/2, this.size);
                grad.addColorStop(0, this.color);
                grad.addColorStop(1, '#B8860B'); // Darker goldenrod for edge
                
                petalsCtx.fillStyle = grad;
                petalsCtx.fill();
                petalsCtx.restore();
            }
        }

        class Sunflower {
            constructor(x) {
                this.x = x;
                this.targetY = height - (Math.random() * 200 + 150); // Final height
                this.y = height + 100; // Start below screen
                this.stemHeight = 0;
                this.maxStemHeight = height - this.targetY;
                this.flowerSize = 0;
                this.maxFlowerSize = Math.random() * 30 + 40;
                this.growthSpeed = Math.random() * 3 + 2;
                this.bloomed = false;
                
                // Petal properties for the flower
                this.numPetals = 16 + Math.floor(Math.random() * 8);
                this.petalAngleOffset = 0;
                this.swayAngle = (Math.random() - 0.5) * 0.2; // Initial sway
                this.swaySpeed = Math.random() * 0.02 + 0.01;
                this.time = Math.random() * 100;
            }

            update() {
                this.time += this.swaySpeed;
                // Sway effect
                this.currentSway = Math.sin(this.time) * 0.1 + this.swayAngle;

                if (this.y > this.targetY) {
                    // Growing stem
                    this.y -= this.growthSpeed;
                    this.stemHeight += this.growthSpeed;
                } else if (!this.bloomed) {
                    // Blooming flower
                    this.flowerSize += 1.5;
                    this.petalAngleOffset += 0.05; // Spin slightly while blooming
                    if (this.flowerSize >= this.maxFlowerSize) {
                        this.bloomed = true;
                        this.flowerSize = this.maxFlowerSize;
                    }
                } else {
                    // Gentle idle animation
                    this.petalAngleOffset += 0.005;
                }
            }

            draw() {
                sunflowersCtx.save();
                sunflowersCtx.translate(this.x, height);
                
                // Rotate base slightly for natural look
                sunflowersCtx.rotate(this.currentSway);
                
                // Draw Stem
                sunflowersCtx.beginPath();
                sunflowersCtx.moveTo(0, 0);
                // Curve stem slightly based on sway
                sunflowersCtx.quadraticCurveTo(
                    this.stemHeight * 0.2 * Math.sin(this.time), 
                    -this.stemHeight / 2, 
                    0, 
                    -this.stemHeight
                );
                sunflowersCtx.lineWidth = 8;
                sunflowersCtx.lineCap = 'round';
                const stemGrad = sunflowersCtx.createLinearGradient(0, 0, 0, -this.stemHeight);
                stemGrad.addColorStop(0, '#228B22'); // Forest Green
                stemGrad.addColorStop(1, '#32CD32'); // Lime Green
                sunflowersCtx.strokeStyle = stemGrad;
                sunflowersCtx.stroke();

                // Draw Leaves
                if (this.stemHeight > 100) {
                     this.drawLeaf(sunflowersCtx, 0, -this.stemHeight * 0.4, 30, Math.PI / 4 + Math.sin(this.time)*0.1);
                     if (this.stemHeight > 200) {
                        this.drawLeaf(sunflowersCtx, 0, -this.stemHeight * 0.7, 25, -Math.PI / 4 - Math.sin(this.time*1.2)*0.1);
                     }
                }

                // Translate to top of stem to draw flower
                sunflowersCtx.translate(0, -this.stemHeight);

                // Draw Flower Head
                if (this.flowerSize > 0) {
                    // Draw Petals
                    for (let i = 0; i < this.numPetals; i++) {
                        let angle = (i * (Math.PI * 2) / this.numPetals) + this.petalAngleOffset;
                        this.drawFlowerPetal(sunflowersCtx, angle, this.flowerSize);
                    }

                    // Draw Center (Seeds)
                    sunflowersCtx.beginPath();
                    sunflowersCtx.arc(0, 0, this.flowerSize * 0.45, 0, Math.PI * 2);
                    const centerGrad = sunflowersCtx.createRadialGradient(0, 0, 0, 0, 0, this.flowerSize * 0.45);
                    centerGrad.addColorStop(0, '#3E2723'); // Very dark brown
                    centerGrad.addColorStop(0.7, '#4E342E');
                    centerGrad.addColorStop(1, '#212121'); // Blackish edge
                    sunflowersCtx.fillStyle = centerGrad;
                    sunflowersCtx.fill();
                    
                    // Add some seed texture dots
                    sunflowersCtx.fillStyle = '#5D4037';
                    for(let i=0; i<30; i++) {
                        const r = Math.random() * (this.flowerSize * 0.4);
                        const a = Math.random() * Math.PI * 2;
                        sunflowersCtx.beginPath();
                        sunflowersCtx.arc(r * Math.cos(a), r * Math.sin(a), 1.5, 0, Math.PI*2);
                        sunflowersCtx.fill();
                    }
                }

                sunflowersCtx.restore();
            }

            drawLeaf(ctx, x, y, size, angle) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(size/2, -size/4, size, 0);
                ctx.quadraticCurveTo(size/2, size/4, 0, 0);
                ctx.fillStyle = '#32CD32';
                ctx.fill();
                ctx.strokeStyle = '#006400';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();
            }

            drawFlowerPetal(ctx, angle, length) {
                ctx.save();
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(length/4, -length/3, length, 0);
                ctx.quadraticCurveTo(length/4, length/3, 0, 0);
                
                const petalGrad = ctx.createLinearGradient(0, 0, length, 0);
                petalGrad.addColorStop(0, '#FFA500'); // Orange inner
                petalGrad.addColorStop(0.4, '#FFD700'); // Gold middle
                petalGrad.addColorStop(1, '#FFF200'); // Bright yellow tip
                
                ctx.fillStyle = petalGrad;
                ctx.fill();
                ctx.strokeStyle = '#DAA520'; // Goldenrod outline
                ctx.lineWidth = 0.5;
                ctx.stroke();
                ctx.restore();
            }
        }

        const petalsArray = [];
        const numPetals = 80;
        for (let i = 0; i < numPetals; i++) {
            petalsArray.push(new Petal());
        }

        let sunflowersArray = [];
        let growingPhase = false;

        function animate() {
            // Clear canvases
            petalsCtx.clearRect(0, 0, width, height);
            sunflowersCtx.clearRect(0, 0, width, height);

            // Animate falling petals
            for (let i = 0; i < petalsArray.length; i++) {
                petalsArray[i].update();
                petalsArray[i].draw();
            }

            // Animate sprouting sunflowers
            if (growingPhase) {
                for (let i = 0; i < sunflowersArray.length; i++) {
                    sunflowersArray[i].update();
                    sunflowersArray[i].draw();
                }
            }

            requestAnimationFrame(animate);
        }

        actionBtn.addEventListener('click', () => {
            // Hide the button smoothly
            btnContainer.style.opacity = '0';
            setTimeout(() => {
                btnContainer.style.display = 'none';
            }, 300);

            // Show custom audio player sliding down from top and fade in the background photo
            setTimeout(() => {
                customPlayer.classList.add('show');
                bgPhoto.classList.add('show');
            }, 800);

            // Trigger the sunflower growth
            growingPhase = true;
            
            // Create sunflowers across the bottom
            const numSunflowers = Math.floor(width / 80); // Adjust spacing based on width
            for(let i=0; i <= numSunflowers; i++) {
                // Stagger spawn time slightly for organic feel
                setTimeout(() => {
                    const xPos = (width / numSunflowers) * i + (Math.random() * 40 - 20); // Add slight randomness to x
                    sunflowersArray.push(new Sunflower(xPos));
                }, Math.random() * 1500); // Spread spawn over 1.5 seconds
            }
        });

        // Start the animation loop
        animate();

    </script>
</body>
</html>
